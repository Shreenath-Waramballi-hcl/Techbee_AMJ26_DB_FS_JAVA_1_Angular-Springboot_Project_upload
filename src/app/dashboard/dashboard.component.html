<div class="dashboard-container">

<div class="hero-section">

<h1>🎓 Student Feedback Dashboard</h1>

<p>
Monitor and analyze student feedback records.
</p>

</div>

<div class="stats-container">

<div class="stat-card total-card">

<div class="icon">📝</div>

<h2>{{totalFeedbacks}}</h2>

<p>Total Feedbacks</p>

</div>

<div class="stat-card average-card">

<div class="icon">⭐</div>

<h2>{{averageRating | number:'1.1-1'}}</h2>

<p>Average Rating</p>

</div>

<div class="stat-card highest-card">

<div class="icon">🏆</div>

<h2>{{highestRating}}</h2>

<p>Highest Rating</p>

</div>

</div>

<div class="action-section">

<h2>⚡ Quick Actions</h2>

<div class="action-buttons">

<button routerLink="/add">
➕ Add Feedback
</button>

<button routerLink="/feedbacks">
📋 View Feedbacks
</button>

</div>

</div>

</div>
