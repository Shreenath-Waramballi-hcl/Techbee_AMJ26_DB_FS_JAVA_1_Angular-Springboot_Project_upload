<div class="feedback-list-page">

<div class="table-card">

<div class="table-card-header">
<div>
<h3>🎓 Student Feedback List</h3>
<p>Manage and review student feedback records</p>
</div>
</div>

<div class="table-responsive">

<table class="table feedback-table">

<thead>
<tr>
<th>Student</th>
<th>USN</th>
<th>Department</th>
<th>Faculty</th>
<th>Rating</th>
<th>Feedback</th>
<th>Action</th>
</tr>
</thead>

<tbody>

<tr *ngFor="let feedback of feedbacks | async">

<td>
<div class="student-cell">
<div class="student-icon">
<i class="bi bi-person-fill"></i>
</div>
<strong>{{feedback.studentName}}</strong>
</div>
</td>

<td>{{feedback.usn}}</td>

<td>{{feedback.department}}</td>

<td>{{feedback.facultyName}}</td>

<td>
<span class="rating-badge">
⭐ {{feedback.rating}}
</span>
</td>

<td class="feedback-text">
{{feedback.feedback}}
</td>

<td>
<div class="action-buttons">

<button
class="action-btn view-btn"
title="View"
(click)="details(feedback.id)">
<i class="bi bi-eye-fill"></i>
</button>

<button
class="action-btn edit-btn"
title="Edit"
(click)="updateFeedback(feedback.id)">
<i class="bi bi-pencil-fill"></i>
</button>

<button
class="action-btn delete-btn"
title="Delete"
(click)="deleteFeedback(feedback.id)">
<i class="bi bi-trash-fill"></i>
</button>

</div>
</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>
